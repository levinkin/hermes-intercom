name: intercom
version: "1.0.0"
description: "Lets desktop, cli and tui chats on one machine list each other and send/ask/reply. Idle chats start a turn, busy ones get it next turn. Messages between processes are sealed with aes-256-gcm."
requires_hermes: ">=0.23.0"
author: "levinkin (fork of majordave/hermes-intercom)"
kind: standalone
provides_tools:
  - intercom
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_finalize
